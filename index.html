<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFMENA Esports | Tournament Stats</title>
  <meta name="description" content="FFMENA Esports official tournament statistics and leaderboards.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://strakhovggadmin.ffmea.gameid.garena.co.id; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1.0.0">
  <link rel="stylesheet" href="css/styles.css?v=1.0.0">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="favicon.svg" alt="" class="logo-favicon">
        <div class="logo">FF<span>MENA</span></div>
      </div>
      <nav class="header-nav">
        <a href="index.html" class="nav-link active">Tournaments</a>
      </nav>
    </div>
  </header>

  <!-- TOURNAMENT SELECTION VIEW -->
  <section id="tournamentSelectView">
    <div class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">FFMENA <span class="accent">ESPORTS</span></h1>
        <p class="hero-subtitle">Official Tournament Statistics &amp; Rankings</p>
      </div>
    </div>
    <div class="container">
      <div class="tournament-grid" id="tournamentGrid">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- LEADERBOARD VIEW -->
  <section id="leaderboardView" class="hidden">
    <div class="container">
      <div class="leaderboard-header">
        <button class="btn-back" id="btnBackToTournaments">
          &#8592; All Tournaments
        </button>
        <div class="tournament-info" id="tournamentInfo"></div>
      </div>

      <div class="filters-bar fade-in">
        <div class="filter-group">
          <label class="filter-label">Phase</label>
          <select id="filterPhase"><option value="">All Phases</option></select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Day</label>
          <select id="filterDay"><option value="">All Days</option></select>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabTeams">Teams</button>
        <button class="tab-btn" id="tabPlayers">Players</button>
      </div>

      <!-- Stats Summary Bar (populated by public.js) -->
      <div id="statsBar" class="stats-summary-bar" style="display:none"></div>

      <div id="tableContainer">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">FFMENA Esports</span>
      <span class="footer-copy">&copy; 2026 All rights reserved</span>
    </div>
  </footer>

  <script src="js/runtime-config.js?v=1.0.0"></script>
  <script src="js/api-client.js?v=1.0.0"></script>
  <script src="js/data.js?v=1.0.0"></script>
  <script src="js/public.js?v=1.0.0"></script>
</body>
</html>
